# Publish checksummed standalone voice gateway archives on version tags pushed to gomodedev/gomode.
name: Release voice gateway
on:
  push:
    tags: ["v*"]
permissions:
  contents: read

jobs:
  release:
    # Repository tag-push permissions authorize publishers; forks cannot publish here.
    if: github.repository == 'gomodedev/gomode'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            Makefile
            go.mod
            go.sum
      - name: Publish release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          log=$(mktemp)
          trap 'rm -f -- "$log"' EXIT
          if make release 2>&1 | tee "$log"; then
            exit 0
          fi
          # A release published during the upload can claim the tag before
          # GoReleaser publishes its draft. A retry finds the published release.
          if grep -Fq 'Resource:Release Field:tag_name Code:already_exists' "$log"; then
            make release
          else
            exit 1
          fi
